<html lang="es">
<head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      --cream: #F8F4E8;
      --cream2: #EDE8D5;
      --burgundy: #6B2D4E;
      --burgundy2: #8B3A62;
      --orange: #E8601C;
      --coral: #F08060;
      --pink: #D94070;
      --purple: #9B5EA2;
      --green: #4A7C59;
      --green2: #6B9E6E;
      --yellow: #C8A020;
      --text: #3A2830;
      --gray: #7A6870;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--text); font-family: 'Jost', sans-serif; font-weight: 300; overflow-x: hidden; }

    .hero {
      min-height: 100vh; background: var(--cream);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 4rem 2rem 3rem; position: relative; overflow: hidden;
    }
    .hero-tag {
      font-family: 'Jost', sans-serif; font-size: .6rem; letter-spacing: .5em;
      text-transform: uppercase; color: var(--green); margin-bottom: 1rem;
      animation: fadeUp .8s ease both;
    }
    .fecha-wrap { position: relative; display: inline-block; }
    .fecha-stack {
      display: flex; flex-direction: column; align-items: center;
      line-height: .85; position: relative; z-index: 2;
      animation: fadeUp .9s .1s ease both;
    }
    .fecha-num {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: clamp(7rem, 28vw, 13rem); color: var(--burgundy);
      letter-spacing: -.02em; line-height: .88;
    }
    .wedding-of {
      font-family: 'Dancing Script', cursive; font-size: clamp(1.8rem, 6vw, 3rem);
      color: var(--orange); margin: 1.2rem 0 .6rem; position: relative; z-index: 4;
      animation: fadeUp .9s .3s ease both;
    }
    .wedding-of::before, .wedding-of::after {
      content: '——'; font-family: 'Cormorant Garamond', serif; font-size: .75em;
      color: var(--green); opacity: .6; vertical-align: middle; margin: 0 .4em;
    }
    .hero-names {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(.9rem, 2.5vw, 1.1rem);
      letter-spacing: .3em; text-transform: uppercase; color: var(--burgundy);
      font-weight: 600; animation: fadeUp .9s .4s ease both;
    }
    .hero-date-text {
      font-size: .68rem; letter-spacing: .25em; color: var(--gray);
      margin-top: .5rem; animation: fadeUp .9s .5s ease both;
    }
    .corner-floral { position: absolute; pointer-events: none; opacity: .75; }
    .corner-floral.tl { top: 0; left: 0; width: 220px; }
    .corner-floral.tr { top: 0; right: 0; width: 220px; transform: scaleX(-1); }
    .corner-floral.bl { bottom: 0; left: 0; width: 170px; transform: scaleY(-1); }
    .corner-floral.br { bottom: 0; right: 0; width: 170px; transform: scale(-1); }

    /* Countdown */
    .countdown-wrap {
      background: var(--cream2); padding: 3rem 1.5rem; text-align: center;
      border-top: 1px solid rgba(107,45,78,.12); border-bottom: 1px solid rgba(107,45,78,.12);
    }
    .cd-title { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--burgundy); margin-bottom: 1.5rem; }
    .countdown { display: flex; justify-content: center; gap: clamp(.8rem, 5vw, 4rem); flex-wrap: wrap; }
    .c-unit { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
    .c-num { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 11vw, 5.5rem); color: var(--burgundy); line-height: 1; font-weight: 700; }
    .c-label { font-size: .55rem; letter-spacing: .3em; text-transform: uppercase; color: var(--green); }
    .c-sep { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 7vw, 4rem); color: var(--coral); opacity: .5; align-self: center; padding-bottom: .8rem; }

    /* Sections */
    .section { max-width: 680px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
    .s-tag { font-size: .58rem; letter-spacing: .45em; text-transform: uppercase; color: var(--green); margin-bottom: .5rem; }
    .s-title { font-family: 'Dancing Script', cursive; font-size: clamp(2.5rem, 8vw, 4rem); color: var(--burgundy); line-height: 1.2; margin-bottom: .5rem; }
    .s-divider { display: flex; align-items: center; justify-content: center; gap: .6rem; margin: .8rem auto 2rem; }
    .s-divider::before { content: ''; flex: 1; max-width: 70px; height: 1px; background: linear-gradient(90deg, transparent, var(--coral)); }
    .s-divider::after { content: ''; flex: 1; max-width: 70px; height: 1px; background: linear-gradient(270deg, transparent, var(--coral)); }
    .s-divider span { color: var(--coral); font-size: .9rem; }
    .s-text { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; line-height: 2; color: var(--gray); max-width: 520px; margin: 0 auto; font-style: italic; }
    .divider-line { width: 100%; max-width: 680px; margin: 0 auto; height: 1px; background: linear-gradient(90deg, transparent, var(--coral), var(--pink), var(--purple), var(--coral), transparent); opacity: .3; }

    /* Photo */
    .foto-pareja { width: 100%; max-width: 460px; border-radius: 4px; margin: 0 auto 1rem; display: block; box-shadow: 0 12px 50px rgba(107,45,78,.18); border: 6px solid #fff; outline: 1px solid rgba(107,45,78,.15); }
    .itinerario-img { width: 100%; max-width: 360px; margin: 0 auto; display: block; border-radius: 4px; }

    /* Lugares */
    .lugares-wrap { background: linear-gradient(180deg, var(--cream2), var(--cream)); }
    .lugar-bloque { max-width: 480px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; border-bottom: 1px solid rgba(107,45,78,.1); }
    .lugar-titulo { font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 6vw, 3rem); color: var(--burgundy); margin-bottom: .5rem; }
    .lugar-icon-img { width: 60px; height: 60px; object-fit: contain; margin: 0 auto .8rem; display: block; filter: sepia(.4) saturate(.7) hue-rotate(300deg); }
    .lugar-info { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; color: var(--gray); line-height: 2; margin-bottom: 1.3rem; }
    .btn-maps { display: inline-block; padding: .7rem 2.2rem; background: var(--burgundy); color: #fff; font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; text-decoration: none; border-radius: 30px; font-family: 'Jost', sans-serif; transition: background .2s, transform .15s; }
    .btn-maps:hover { background: var(--orange); transform: translateY(-2px); }

    /* Versiculo */
    .versiculo-wrap { background: linear-gradient(135deg, var(--burgundy) 0%, #4A1830 100%); padding: 4rem 1.5rem; text-align: center; position: relative; overflow: hidden; }
    .versiculo-wrap::before { content: '\201C'; position: absolute; top: -3rem; left: 50%; transform: translateX(-50%); font-family: 'Playfair Display', serif; font-size: 18rem; color: rgba(255,255,255,.04); pointer-events: none; }
    .versiculo-line { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,96,28,.5), transparent); margin: 0 auto 1.5rem; }
    .versiculo-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1rem, 2.5vw, 1.2rem); color: rgba(255,255,255,.85); line-height: 2; max-width: 500px; margin: 0 auto 1rem; }
    .versiculo-ref { font-size: .6rem; letter-spacing: .35em; text-transform: uppercase; color: var(--coral); }

    /* Galeria */
    .galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 680px; margin: 0 auto; padding: 0 1.5rem 1.5rem; }
    .galeria-item { aspect-ratio: 1/1; overflow: hidden; border-radius: 4px; cursor: pointer; background: var(--cream2); }
    .galeria-item.wide { grid-column: span 2; aspect-ratio: 2/1; }
    .galeria-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; display: block; }
    .galeria-item:hover img { transform: scale(1.07); }
    .lb { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(20,8,10,.95); align-items: center; justify-content: center; }
    .lb.open { display: flex; }
    .lb img { max-width: 96%; max-height: 92svh; object-fit: contain; }
    .lb-close { position: absolute; top: 1rem; right: 1.2rem; color: var(--coral); font-size: 2.2rem; cursor: pointer; background: none; border: none; }

    /* Fiesta */
    .fiesta-wrap { background: var(--cream2); padding: 1.5rem; }
    .fiesta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 500px; margin: 0 auto; }
    @media(max-width:580px) { .fiesta-grid { grid-template-columns: 1fr; } }
    .fiesta-item { background: #fff; border: 1px solid rgba(107,45,78,.15); border-radius: 4px; padding: 2rem 1.2rem; text-align: center; }
    .fiesta-icon { width: 55px; height: 55px; object-fit: contain; margin: 0 auto .8rem; display: block; filter: sepia(.3) saturate(.8) hue-rotate(290deg); }
    .fiesta-titulo { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: var(--burgundy); margin-bottom: 1rem; }
    .fiesta-texto { font-family: 'Cormorant Garamond', serif; font-size: .95rem; color: var(--gray); line-height: 1.9; }

    /* Hashtag */
    .hashtag-wrap { background: linear-gradient(135deg, var(--burgundy), #4A1830); padding: 3rem 1.5rem; text-align: center; }
    .hashtag-label { font-size: .58rem; letter-spacing: .4em; text-transform: uppercase; color: var(--coral); margin-bottom: .5rem; }
    .hashtag { font-family: 'Dancing Script', cursive; font-size: clamp(2.5rem, 9vw, 5rem); color: #fff; display: block; margin: .5rem 0; }
    .hashtag-sub { font-size: .8rem; color: rgba(255,255,255,.5); line-height: 1.9; max-width: 380px; margin: 0 auto; }

    /* Recos */
    .reco-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 600px; margin: 0 auto; }
    @media(max-width:460px) { .reco-grid { grid-template-columns: 1fr; } }
    .reco-card { background: #fff; border: 1px solid rgba(107,45,78,.15); border-radius: 4px; padding: 2rem 1.2rem; text-align: center; }
    .reco-icon { width: 55px; height: 55px; object-fit: contain; margin: 0 auto .8rem; display: block; filter: sepia(.3) saturate(.8) hue-rotate(290deg); }
    .reco-titulo { font-family: 'Dancing Script', cursive; font-size: 1.3rem; color: var(--burgundy); margin-bottom: .5rem; }
    .reco-texto { font-family: 'Cormorant Garamond', serif; font-size: .95rem; color: var(--gray); line-height: 1.85; }

    /* RSVP */
    .rsvp-wrap { background: linear-gradient(160deg, var(--burgundy) 0%, #4A1830 100%); padding: 5rem 1.5rem; text-align: center; position: relative; overflow: hidden; }
    .rsvp-wrap::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--orange), var(--pink), var(--purple), var(--green2), var(--yellow)); }
    .rsvp-form { max-width: 480px; margin: 0 auto; text-align: left; }
    .rsvp-field { margin-bottom: 1.3rem; }
    .rsvp-field label { display: block; font-size: .58rem; letter-spacing: .28em; text-transform: uppercase; color: var(--coral); margin-bottom: .45rem; }
    .rsvp-field input, .rsvp-field select, .rsvp-field textarea { width: 100%; padding: .75rem 1rem; background: rgba(255,255,255,.08); border: 1px solid rgba(232,96,28,.3); border-radius: 4px; color: rgba(255,255,255,.9); font-family: 'Jost', sans-serif; font-size: .88rem; font-weight: 300; outline: none; transition: border-color .2s, background .2s; }
    .rsvp-field input::placeholder, .rsvp-field textarea::placeholder { color: rgba(255,255,255,.3); }
    .rsvp-field input:focus, .rsvp-field select:focus, .rsvp-field textarea:focus { border-color: var(--orange); background: rgba(255,255,255,.12); }
    .rsvp-field select { appearance: none; cursor: pointer; }
    .rsvp-field select option { background: #3A1020; color: #fff; }
    .rsvp-field textarea { resize: vertical; min-height: 80px; }
    .btn-rsvp { width: 100%; padding: 1rem 2rem; background: var(--orange); color: #fff; border: none; border-radius: 30px; font-family: 'Jost', sans-serif; font-size: .68rem; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; cursor: pointer; transition: background .2s, transform .15s; margin-top: .5rem; }
    .btn-rsvp:hover { background: var(--coral); transform: translateY(-2px); }
    .btn-rsvp:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    footer { background: #1A0810; padding: 2rem 1rem; text-align: center; }
    footer p { font-size: .58rem; letter-spacing: .3em; text-transform: uppercase; color: rgba(232,96,28,.3); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

const Countdown = () => {
  const pad = n => String(n).padStart(2,'0');
  const calc = () => {
    const d = CONFIG.fechaBoda - new Date();
    if(d<=0) return {d:'00',h:'00',m:'00',s:'00'};
    return { d:pad(Math.floor(d/86400000)), h:pad(Math.floor((d%86400000)/3600000)), m:pad(Math.floor((d%3600000)/60000)), s:pad(Math.floor((d%60000)/1000)) };
  };
  const [t,setT] = React.useState(calc);
  React.useEffect(()=>{ const id=setInterval(()=>setT(calc()),1000); return ()=>clearInterval(id); },[]);
  return (
    <div className="countdown-wrap reveal">
      <div className="cd-title">Faltan...</div>
      <div className="countdown">
        <div className="c-unit"><span className="c-num">{t.d}</span><span className="c-label">Días</span></div>
        <div className="c-sep">:</div>
        <div className="c-unit"><span className="c-num">{t.h}</span><span className="c-label">Horas</span></div>
        <div className="c-sep">:</div>
        <div className="c-unit"><span className="c-num">{t.m}</span><span className="c-label">Minutos</span></div>
        <div className="c-sep">:</div>
        <div className="c-unit"><span className="c-num">{t.s}</span><span className="c-label">Segundos</span></div>
      </div>
    </div>
  );
};

const Confirmar = () => {
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbxeSDF4udZSzUcd07ucQct_-6O9ob4bTyIcbBb7lvgsyVxVAiMgq88z1eUbEozhZ3UvXg/exec";
  const [paso,setPaso]=React.useState(1);
  const [inv,setInv]=React.useState(null);
  const [form,setForm]=React.useState({asistencia:'Si',personas:'1',mensaje:''});
  const [st,setSt]=React.useState('idle');
  React.useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const n=(p.get('invitado')||'').trim();
    if(!n) return;
    fetch(`${SHEET_URL}?action=verificar&nombre=${encodeURIComponent(n)}`)
      .then(r=>r.json()).then(d=>{
        if(d.ok){setInv(d);setForm(f=>({...f,personas:'1'}));setPaso(2);}
        else{setInv({nombre:n,maxPersonas:5,mesa:''});setPaso(2);}
      }).catch(()=>{setInv({nombre:n,maxPersonas:5,mesa:''});setPaso(2);});
  },[]);
  const enviar=async()=>{
    setSt('loading');
    try{
      const b=new FormData();
      ['action','rsvp','nombre',inv.nombre,'mesa',inv.mesa,'asistencia',form.asistencia,'personas',form.personas,'mensaje',form.mensaje].forEach((_,i,a)=>{ if(i%2===0) b.append(a[i],a[i+1]); });
      b.set('action','rsvp');
      await fetch(SHEET_URL,{method:'POST',body:b,mode:'no-cors'});
      setSt('ok');setPaso(3);
    }catch{setSt('err');}
  };
  const hnd=e=>setForm({...form,[e.target.name]:e.target.value});
  const opts=inv?Array.from({length:inv.maxPersonas},(_,i)=>i+1):[1];
  const DS={fontFamily:"'Dancing Script',cursive"};
  const CG={fontFamily:"'Cormorant Garamond',serif"};
  return (
    <div className="rsvp-wrap reveal">
      <p style={{fontSize:'.58rem',letterSpacing:'.45em',textTransform:'uppercase',color:'var(--coral)',marginBottom:'.5rem'}}>RSVP</p>
      <div style={{...DS,fontSize:'clamp(2.5rem,9vw,4.5rem)',color:'#fff',marginBottom:'.5rem'}}>Confirmar Asistencia</div>
      <div style={{display:'inline-block',border:'1px solid var(--orange)',color:'var(--coral)',fontSize:'.6rem',letterSpacing:'.22em',textTransform:'uppercase',padding:'.5rem 1.8rem',borderRadius:'30px',marginBottom:'1.5rem'}}>{CONFIG.fechaLimite}</div>
      <p style={{...CG,fontStyle:'italic',fontSize:'.95rem',color:'rgba(255,255,255,.6)',lineHeight:1.9,maxWidth:'420px',margin:'0 auto 2.5rem'}}>Para nosotros es muy importante que confirmes tu asistencia antes de la fecha indicada. 💛</p>
      <div className="rsvp-form">
        {paso===1&&<div style={{textAlign:'center',padding:'2rem 0',color:'rgba(255,255,255,.5)',fontSize:'.85rem'}}>⏳ Cargando...</div>}
        {paso===2&&inv&&(
          <>
            <div style={{background:'rgba(232,96,28,.1)',border:'1px solid rgba(232,96,28,.3)',borderRadius:'4px',padding:'1.2rem 1.4rem',marginBottom:'1.5rem',textAlign:'center'}}>
              <div style={{fontSize:'1.58rem',letterSpacing:'.3em',textTransform:'uppercase',color:'var(--coral)',marginBottom:'.4rem'}}>Bienvenido/a</div>
              <div style={{...DS,fontSize:'2rem',color:'#fff',lineHeight:1.2}}>{inv.nombre}</div>
              {inv.mesa&&<div style={{fontSize:'1.2rem',color:'rgba(255,255,255,.45)',marginTop:'.4rem',letterSpacing:'.15em'}}>Mesa #{inv.mesa}</div>}
              <div style={{fontSize:'1.2rem',color:'rgba(255,255,255,.4)',marginTop:'.5rem'}}>Puedes confirmar hasta <strong style={{color:'var(--coral)'}}>{inv.maxPersonas} persona{inv.maxPersonas>1?'s':''}</strong></div>
            </div>
            <div className="rsvp-field"><label>¿Asistirás a la boda?</label>
              <select name="asistencia" value={form.asistencia} onChange={hnd}>
                <option value="Si">✅ Sí, asistiré</option><option value="No">❌ No podré asistir</option>
              </select>
            </div>
            {form.asistencia==='Si'&&(
              <div style={{display:'flex',justifyContent:'center',marginBottom:'1.3rem'}}>
                <div className="rsvp-field" style={{width:'500px'}}><label>N° de personas</label>
                  <select name="personas" value={form.personas} onChange={hnd}>
                    {opts.map(n=><option key={n} value={n}>{n} persona{n>1?'s':''}</option>)}
                  </select>
                </div>
              </div>
            )}
            <div className="rsvp-field"><label>Mensaje para los novios (opcional)</label>
              <textarea name="mensaje" value={form.mensaje} onChange={hnd} placeholder="Un mensaje, deseo o nota especial... 💌"/>
            </div>
            {st==='err'&&<div style={{display:'block',background:'rgba(255,80,80,.1)',border:'1px solid rgba(255,80,80,.3)',color:'#ffaaaa',padding:'1rem',borderRadius:'4px',marginBottom:'1rem',fontSize:'.85rem'}}>😕 Error al enviar. Intenta de nuevo.</div>}
            <button className="btn-rsvp" onClick={enviar} disabled={st==='loading'}>{st==='loading'?'⏳ Enviando...':'💌 Confirmar Asistencia'}</button>
          </>
        )}
        {paso===3&&(
          <div style={{textAlign:'center',padding:'2rem 0'}}>
            <div style={{fontSize:'3.5rem',marginBottom:'1rem'}}>🎉</div>
            <div style={{...DS,fontSize:'2.8rem',color:'var(--coral)',marginBottom:'.8rem'}}>¡Confirmado!</div>
            <p style={{...CG,fontStyle:'italic',color:'rgba(255,255,255,.65)',fontSize:'.95rem',lineHeight:2,maxWidth:'360px',margin:'0 auto'}}>
              Gracias <strong style={{color:'var(--coral)'}}>{inv?.nombre}</strong>, tu asistencia fue registrada. ¡Nos vemos el día de la boda! 💛
            </p>
            {inv?.mesa&&<div style={{marginTop:'1.5rem',display:'inline-block',border:'1px solid var(--orange)',borderRadius:'30px',padding:'.5rem 2rem',color:'var(--coral)',fontSize:'.68rem',letterSpacing:'.2em'}}>MESA #{inv.mesa}</div>}
          </div>
        )}
      </div>
    </div>
  );
};

);

const App = () => {
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbxeSDF4udZSzUcd07ucQct_-6O9ob4bTyIcbBb7lvgsyVxVAiMgq88z1eUbEozhZ3UvXg/exec";
  const [acc,setAcc]=React.useState('loading');
  const [nUrl,setNUrl]=React.useState('');
  React.useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const inv=(p.get('invitado')||'').trim();
    if(!inv){setAcc('no-param');return;}
    setNUrl(inv);
    const sT=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
    fetch(`${SHEET_URL}?action=verificarNombre&nombre=${encodeURIComponent(sT(inv))}`)
      .then(r=>r.json()).then(d=>{
        if(d.ok===true){setAcc('ok');return;}
        if(d.ok===false){setAcc('denied');return;}
        setAcc('ok');
      }).catch(()=>setAcc('ok'));
  },[]);
  React.useEffect(()=>{
    if(acc!=='ok') return;
    const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:.1});
    setTimeout(()=>document.querySelectorAll('.reveal').forEach(el=>obs.observe(el)),100);
    return ()=>obs.disconnect();
  },[acc]);
  if(acc==='loading') return <Cargando/>;
  if(acc==='no-param') return <AccesoDenegado nombre={null}/>;
  if(acc==='denied') return <AccesoDenegado nombre={nUrl}/>;
  return (
    <>
      <Hero/><Countdown/><Mensaje/><GoldLine/><FotoPareja/><GoldLine/>
      <Itinerario/><GoldLine/><Lugares/><GoldLine/><Galeria/><Versiculo/>
      <Fiesta/><Hashtag/><Recomendaciones/><GoldLine/><Confirmar/><Footer/>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
