```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación Boda</title>

  <!-- Evitar caché -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7f7f7;
      padding: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .denied {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Invitación</h2>
    <p id="mensaje">Verificando invitación...</p>
  </div>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxeSDF4udZSzUcd07ucQct_-6O9ob4bTyIcbBb7lvgsyVxVAiMgq88z1eUbEozhZ3UvXg/exec";

    // Obtener parámetro de la URL
    function getParametro(nombre) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(nombre);
    }

    // JSONP para evitar CORS
    function verificarInvitado(nombre) {
      return new Promise((resolve) => {
        const script = document.createElement("script");
        const callbackName = "callback_" + Date.now();

        window[callbackName] = function(data) {
          resolve(data);
          document.body.removeChild(script);
          delete window[callbackName];
        };

        script.src = `${SHEET_URL}?nombre=${encodeURIComponent(nombre)}&callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    const invitado = getParametro("invitado");
    const mensaje = document.getElementById("mensaje");

    if (!invitado) {
      mensaje.innerHTML = "<span class='denied'>Acceso no válido</span>";
    } else {
      verificarInvitado(invitado).then(data => {
        if (data.ok) {
          mensaje.innerHTML = `<span class='ok'>Bienvenido ${invitado}</span>`;
        } else {
          mensaje.innerHTML = `<span class='denied'>Acceso no válido<br>${invitado}</span>`;
        }
      }).catch(() => {
        mensaje.innerHTML = "<span class='denied'>Error de conexión</span>";
      });
    }
  </script>

</body>
</html>
```
