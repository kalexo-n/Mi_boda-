```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación Boda</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }

    .ok { color: green; }
    .denied { color: red; }

    button {
      padding: 10px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Invitación</h2>
  <p id="mensaje">Validando invitación...</p>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxeSDF4udZSzUcd07ucQct_-6O9ob4bTyIcbBb7lvgsyVxVAiMgq88z1eUbEozhZ3UvXg/exec";

// Obtener invitado
function getInvitado() {
  const params = new URLSearchParams(window.location.search);
  return params.get("invitado");
}

// JSONP
function llamarAPI(nombre) {
  return new Promise((resolve) => {
    const callback = "cb_" + Date.now();

    window[callback] = function(data) {
      resolve(data);
      delete window[callback];
      script.remove();
    };

    const script = document.createElement("script");
    script.src = `${SHEET_URL}?action=verificar&nombre=${encodeURIComponent(nombre)}&callback=${callback}`;
    document.body.appendChild(script);
  });
}

// UI
const invitado = getInvitado();
const mensaje = document.getElementById("mensaje");

if (!invitado) {
  mensaje.innerHTML = "<span class='denied'>Acceso no válido</span>";
} else {
  llamarAPI(invitado).then(res => {
    if (res.ok) {
      mostrarContenido(invitado);
    } else {
      mensaje.innerHTML = `<span class='denied'>Acceso no válido<br>${invitado}</span>`;
    }
  });
}

// Mostrar contenido real
function mostrarContenido(nombre) {
  mensaje.innerHTML = `
    <span class='ok'>Bienvenido ${nombre}</span>
    <p>Te invitamos a nuestra boda 💍</p>
    <p>📅 Fecha: 20 de diciembre</p>
    <p>📍 Lugar: Cartagena</p>
    <br>
    <button onclick="confirmar()">Confirmar asistencia</button>
  `;
}

// Acción (luego conectamos)
function confirmar() {
  alert("Confirmación guardada (siguiente paso)");
}
</script>

</body>
</html>
```
